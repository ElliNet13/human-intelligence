<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console &middot; human-llm-server</title>
<style>
  :root{
    --bg: #14181c;
    --panel: #1b2126;
    --panel-2: #20272d;
    --line: #2a3239;
    --text: #d8dee3;
    --muted: #7c8792;
    --amber: #e8a33d;
    --teal: #4fb6a8;
    --red: #d9695f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: 'IBM Plex Sans', Inter, system-ui, -apple-system, sans-serif;
    display:flex; height:100vh; overflow:hidden;
  }
  code, pre, textarea, .mono{ font-family:'IBM Plex Mono', 'SF Mono', Consolas, monospace; }

  /* ---- sidebar / queue ---- */
  #queue{
    width: 300px; flex-shrink:0; border-right:1px solid var(--line);
    display:flex; flex-direction:column; background:var(--panel);
  }
  #queue header{
    padding:16px 16px 12px; border-bottom:1px solid var(--line);
  }
  #queue header .title{ font-weight:600; font-size:14px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted);}
  #queue header .sub{ font-size:12px; color:var(--muted); margin-top:4px;}
  #ticket-list{ flex:1; overflow-y:auto; }
  .ticket{
    padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer;
    display:flex; flex-direction:column; gap:4px;
  }
  .ticket:hover{ background:var(--panel-2); }
  .ticket.active{ background:var(--panel-2); box-shadow: inset 3px 0 0 var(--amber); }
  .ticket .row1{ display:flex; align-items:center; gap:8px; }
  .dot{
    width:7px; height:7px; border-radius:50%; background:var(--amber); flex-shrink:0;
    box-shadow:0 0 0 3px rgba(232,163,61,.15);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .ticket .id{ font-size:11px; color:var(--muted); }
  .ticket .fmt{
    font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:1px 6px;
    border-radius:3px; border:1px solid var(--line); color:var(--muted);
  }
  .ticket .waiting{ font-size:11px; color:var(--amber); margin-left:auto; }
  .ticket .preview{ font-size:13px; color:var(--text); line-height:1.35; }
  #empty-queue{ padding:24px 16px; color:var(--muted); font-size:13px; line-height:1.5; }

  /* ---- main ---- */
  #main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #placeholder{
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:14px; text-align:center; padding:40px;
  }
  #job-view{ flex:1; display:none; flex-direction:column; min-height:0; }
  #job-header{
    padding:14px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px;
    background:var(--panel);
  }
  #job-header .model{ font-weight:600; font-size:14px; }
  #job-header .meta{ font-size:12px; color:var(--muted); }
  #job-header .spacer{ flex:1; }
  #tools-toggle{
    font-size:12px; color:var(--teal); border:1px solid var(--line); background:none;
    padding:5px 10px; border-radius:5px; cursor:pointer;
  }
  #tools-toggle:hover{ border-color:var(--teal); }

  #tools-panel{
    display:none; padding:14px 24px; border-bottom:1px solid var(--line); background:var(--panel-2);
    max-height:220px; overflow-y:auto;
  }
  .tool-def{ margin-bottom:10px; }
  .tool-def .name{ color:var(--teal); font-weight:600; font-size:13px; }
  .tool-def .desc{ font-size:12px; color:var(--muted); margin:2px 0 4px; }
  .tool-def pre{ font-size:11px; background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:8px; margin:0; overflow-x:auto; color:var(--muted); }

  #thread{ flex:1; overflow-y:auto; padding:20px 24px; }
  .system-block{
    border:1px dashed var(--line); border-radius:8px; padding:10px 14px; margin-bottom:16px;
    font-size:12.5px; color:var(--muted); white-space:pre-wrap; line-height:1.5;
  }
  .system-block .label{ color:var(--amber); font-size:10px; letter-spacing:.08em; text-transform:uppercase; display:block; margin-bottom:6px;}
  .msg{ margin-bottom:14px; display:flex; gap:12px; }
  .msg .avatar{
    width:26px; height:26px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; text-transform:uppercase; margin-top:2px;
  }
  .msg.user .avatar{ background:#2c3e50; color:#8fb6d9; }
  .msg.assistant .avatar{ background:#3a2f1a; color:var(--amber); }
  .msg.tool .avatar{ background:#1d3a36; color:var(--teal); }
  .msg .body{ flex:1; min-width:0; }
  .msg .role-label{ font-size:11px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.05em;}
  .block-text{ font-size:14px; line-height:1.5; white-space:pre-wrap; }
  .block-tool-use{
    border:1px solid var(--line); border-radius:7px; padding:8px 12px; margin-top:6px; background:var(--panel);
  }
  .block-tool-use .tu-name{ color:var(--teal); font-size:12.5px; font-weight:600; }
  .block-tool-use pre{ font-size:12px; margin:6px 0 0; color:var(--text); white-space:pre-wrap; }
  .block-tool-result{
    border:1px solid var(--line); border-radius:7px; padding:8px 12px; margin-top:6px; background:var(--panel);
    font-size:12.5px; white-space:pre-wrap; color:var(--muted);
  }
  .block-tool-result.is-error{ border-color: var(--red); color: var(--red); }
  .block-tool-result .tr-label{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:block; margin-bottom:4px;}

  /* ---- responder ---- */
  #responder{
    border-top:1px solid var(--line); background:var(--panel); padding:16px 24px 20px;
  }
  #responder .label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
  #reply-text{
    width:100%; min-height:80px; resize:vertical; background:var(--bg); color:var(--text);
    border:1px solid var(--line); border-radius:7px; padding:10px 12px; font-size:14px; line-height:1.5;
    font-family: inherit;
  }
  #tool-calls-editor{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .tc-row{
    border:1px solid var(--line); border-radius:7px; padding:10px 12px; background:var(--bg);
  }
  .tc-row .tc-top{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .tc-row select{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:5px;
    padding:4px 8px; font-size:12.5px;
  }
  .tc-row .remove-tc{
    margin-left:auto; background:none; border:none; color:var(--red); cursor:pointer; font-size:12px;
  }
  .tc-row textarea{
    width:100%; min-height:56px; background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:5px; padding:8px; font-size:12.5px; resize:vertical;
  }
  #actions-row{ display:flex; align-items:center; gap:10px; margin-top:12px; }
  button{ font-family:inherit; }
  #add-tool-call-btn{
    background:none; border:1px dashed var(--line); color:var(--teal); border-radius:6px;
    padding:6px 12px; font-size:12.5px; cursor:pointer; align-self:flex-start;
  }
  #add-tool-call-btn:hover{ border-color:var(--teal); }
  #send-btn{
    background:var(--amber); color:#1c1406; border:none; border-radius:6px; padding:9px 20px;
    font-size:13.5px; font-weight:600; cursor:pointer;
  }
  #send-btn:hover{ filter:brightness(1.08); }
  #send-btn:disabled{ opacity:.5; cursor:default; }
  #error-btn{
    background:none; border:1px solid var(--line); color:var(--red); border-radius:6px; padding:9px 16px;
    font-size:13px; cursor:pointer;
  }
  #error-btn:hover{ border-color:var(--red); }
  #status-msg{ font-size:12px; color:var(--muted); }
</style>
</head>
<body>

  <div id="queue">
    <header>
      <div class="title">Pending requests</div>
      <div class="sub" id="queue-count">waiting for connections&hellip;</div>
    </header>
    <div id="ticket-list"></div>
  </div>

  <div id="main">
    <div id="placeholder">Pick a request on the left to see the full conversation, tools, and reply as the model.</div>
    <div id="job-view">
      <div id="job-header">
        <div>
          <div class="model mono" id="jh-model"></div>
          <div class="meta" id="jh-meta"></div>
        </div>
        <div class="spacer"></div>
        <button id="tools-toggle" type="button">Tools (<span id="tools-count">0</span>)</button>
      </div>
      <div id="tools-panel"></div>
      <div id="thread"></div>
      <div id="responder">
        <div class="label">Reply as the model</div>
        <textarea id="reply-text" placeholder="Write the assistant's text reply here (optional if you're only calling a tool)&hellip;"></textarea>
        <div id="tool-calls-editor"></div>
        <button id="add-tool-call-btn" type="button">+ Add tool call</button>
        <div id="actions-row">
          <button id="send-btn" type="button">Send reply</button>
          <button id="error-btn" type="button">Return error</button>
          <span id="status-msg"></span>
        </div>
      </div>
    </div>
  </div>

<script>
const ticketListEl = document.getElementById('ticket-list');
const queueCountEl = document.getElementById('queue-count');
const placeholderEl = document.getElementById('placeholder');
const jobViewEl = document.getElementById('job-view');
const jhModel = document.getElementById('jh-model');
const jhMeta = document.getElementById('jh-meta');
const toolsToggle = document.getElementById('tools-toggle');
const toolsCount = document.getElementById('tools-count');
const toolsPanel = document.getElementById('tools-panel');
const threadEl = document.getElementById('thread');
const replyText = document.getElementById('reply-text');
const toolCallsEditor = document.getElementById('tool-calls-editor');
const addToolCallBtn = document.getElementById('add-tool-call-btn');
const sendBtn = document.getElementById('send-btn');
const errorBtn = document.getElementById('error-btn');
const statusMsg = document.getElementById('status-msg');

let pending = [];
let activeJob = null;   // full job detail currently shown
let activeId = null;

function esc(s){
  return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtElapsed(createdSecs){
  const s = Math.max(0, Math.floor(Date.now()/1000 - createdSecs));
  if (s < 60) return s + 's';
  const m = Math.floor(s/60);
  return m + 'm ' + (s%60) + 's';
}

async function refreshQueue(){
  try{
    const res = await fetch('/api/jobs/pending');
    pending = await res.json();
  }catch(e){ return; }

  queueCountEl.textContent = pending.length
    ? pending.length + ' waiting'
    : 'no requests waiting';

  if (!pending.length){
    ticketListEl.innerHTML = '<div id="empty-queue">Nothing queued right now. Point a client at /v1/chat/completions or /v1/messages and it\'ll show up here.</div>';
  } else {
    ticketListEl.innerHTML = pending.map(j => `
      <div class="ticket ${j.id === activeId ? 'active' : ''}" data-id="${j.id}">
        <div class="row1">
          <span class="dot"></span>
          <span class="id mono">#${j.id.slice(0,8)}</span>
          <span class="fmt">${esc(j.format)}</span>
          <span class="waiting mono" data-created="${j.created}">${fmtElapsed(j.created)}</span>
        </div>
        <div class="preview">${esc(j.preview)}</div>
      </div>
    `).join('');
    ticketListEl.querySelectorAll('.ticket').forEach(el => {
      el.addEventListener('click', () => openJob(el.dataset.id));
    });
  }

  // if the active job disappeared (answered/timed out elsewhere), reset view
  if (activeId && !pending.find(j => j.id === activeId)){
    resetView();
  }
}

function resetView(){
  activeId = null;
  activeJob = null;
  jobViewEl.style.display = 'none';
  placeholderEl.style.display = 'flex';
}

async function openJob(id){
  const res = await fetch('/api/jobs/' + id);
  if (!res.ok){ return; }
  activeJob = await res.json();
  activeId = id;
  renderJob();
  placeholderEl.style.display = 'none';
  jobViewEl.style.display = 'flex';
  refreshQueue();
}

function renderJob(){
  const j = activeJob;
  jhModel.textContent = j.model;
  jhMeta.textContent = `${j.format} · max_tokens ${j.extra?.max_tokens ?? '—'} · #${j.id.slice(0,8)}`;

  toolsCount.textContent = (j.tools || []).length;
  toolsPanel.innerHTML = (j.tools || []).map(t => `
    <div class="tool-def">
      <div class="name mono">${esc(t.name)}</div>
      <div class="desc">${esc(t.description || 'no description')}</div>
      <pre>${esc(JSON.stringify(t.input_schema || {}, null, 2))}</pre>
    </div>
  `).join('') || '<div style="color:var(--muted);font-size:12.5px;">No tools were sent with this request.</div>';

  let html = '';
  if (j.system){
    html += `<div class="system-block"><span class="label">System</span>${esc(j.system)}</div>`;
  }
  for (const m of j.messages){
    html += renderMessage(m);
  }
  threadEl.innerHTML = html || '<div style="color:var(--muted);">(empty conversation)</div>';
  threadEl.scrollTop = threadEl.scrollHeight;

  // reset responder
  replyText.value = '';
  toolCallsEditor.innerHTML = '';
  statusMsg.textContent = '';
}

function renderMessage(m){
  const cls = m.role === 'assistant' ? 'assistant' : (m.role === 'tool' ? 'tool' : 'user');
  const initial = m.role === 'assistant' ? 'AI' : (m.role === 'tool' ? 'TL' : 'U');
  let inner = '';
  for (const b of m.blocks){
    if (b.type === 'text'){
      inner += `<div class="block-text">${esc(b.text)}</div>`;
    } else if (b.type === 'tool_use'){
      inner += `<div class="block-tool-use">
        <span class="tu-name mono">&#8594; ${esc(b.name)}</span>
        <pre>${esc(JSON.stringify(b.input, null, 2))}</pre>
      </div>`;
    } else if (b.type === 'tool_result'){
      inner += `<div class="block-tool-result ${b.is_error ? 'is-error' : ''}">
        <span class="tr-label">tool result${b.is_error ? ' (error)' : ''}</span>${esc(b.content)}
      </div>`;
    } else if (b.type === 'image'){
      inner += `<div class="block-text" style="color:var(--muted);font-style:italic;">[image content omitted]</div>`;
    }
  }
  return `<div class="msg ${cls}">
    <div class="avatar">${initial}</div>
    <div class="body">
      <div class="role-label">${esc(m.role)}</div>
      ${inner}
    </div>
  </div>`;
}

toolsToggle.addEventListener('click', () => {
  toolsPanel.style.display = toolsPanel.style.display === 'block' ? 'none' : 'block';
});

addToolCallBtn.addEventListener('click', () => {
  if (!activeJob) return;
  const row = document.createElement('div');
  row.className = 'tc-row';
  const options = (activeJob.tools || []).map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('');
  row.innerHTML = `
    <div class="tc-top">
      <select class="tc-name">${options || '<option value="">(no tools defined)</option>'}</select>
      <button class="remove-tc" type="button">remove</button>
    </div>
    <textarea class="tc-input" placeholder='{"arg": "value"}'>{}</textarea>
  `;
  row.querySelector('.remove-tc').addEventListener('click', () => row.remove());
  toolCallsEditor.appendChild(row);
});

function collectBlocks(){
  const blocks = [];
  const text = replyText.value.trim();
  if (text) blocks.push({type: 'text', text});
  let badJson = false;
  toolCallsEditor.querySelectorAll('.tc-row').forEach(row => {
    const name = row.querySelector('.tc-name').value;
    const raw = row.querySelector('.tc-input').value;
    let input;
    try { input = JSON.parse(raw || '{}'); } catch(e){ badJson = true; input = {}; }
    if (name) blocks.push({type: 'tool_use', name, input});
  });
  return {blocks, badJson};
}

sendBtn.addEventListener('click', async () => {
  if (!activeId) return;
  const {blocks, badJson} = collectBlocks();
  if (badJson){
    statusMsg.textContent = 'One of the tool-call inputs is not valid JSON.';
    statusMsg.style.color = 'var(--red)';
    return;
  }
  if (!blocks.length){
    statusMsg.textContent = 'Write a reply or add a tool call before sending.';
    statusMsg.style.color = 'var(--red)';
    return;
  }
  sendBtn.disabled = true;
  statusMsg.style.color = 'var(--muted)';
  statusMsg.textContent = 'Sending&hellip;';
  const res = await fetch(`/api/jobs/${activeId}/respond`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({blocks})
  });
  sendBtn.disabled = false;
  if (res.ok){
    resetView();
    refreshQueue();
  } else {
    const err = await res.json().catch(() => ({}));
    statusMsg.textContent = err.error || 'Failed to send.';
    statusMsg.style.color = 'var(--red)';
  }
});

errorBtn.addEventListener('click', async () => {
  if (!activeId) return;
  // An "error" reply is just a plain text block explaining the refusal --
  // most clients will happily render assistant text either way. For a true
  // HTTP-level error, stop the process and let the caller time out, or add
  // a dedicated endpoint if you need one.
  replyText.value = replyText.value || 'The operator declined to answer this request.';
  sendBtn.click();
});

setInterval(refreshQueue, 1500);
setInterval(() => {
  document.querySelectorAll('.waiting[data-created]').forEach(el => {
    el.textContent = fmtElapsed(parseFloat(el.dataset.created));
  });
}, 1000);
refreshQueue();
</script>
</body>
</html>
